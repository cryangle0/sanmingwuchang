server {
    listen 80;
    listen [::]:80;
    server_name fanavatar.org www.fanavatar.org;
    return 301 https://fanavatar.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fanavatar.org www.fanavatar.org;

    root /var/www/fanavatar.org;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/fanavatar.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fanavatar.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /health {
        proxy_pass http://127.0.0.1:8787/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /jwgb-assets/ {
        proxy_pass https://vibe-files.aigcresearch.com/AIGame/JourneyWestGreatBrawl/current/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host vibe-files.aigcresearch.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 1h;
        proxy_read_timeout 60s;
    }

    location /match {
        proxy_pass http://127.0.0.1:8787/match;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
